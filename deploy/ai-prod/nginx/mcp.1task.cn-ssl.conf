# jieapi MCP 网关 HTTPS 入口（mcp.1task.cn）
# 证书：acme.sh（Let's Encrypt），HTTP-01；DNS 已指向本机。
limit_req_zone $binary_remote_addr zone=mcp_api:10m rate=300r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/mcp.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcp.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/mcp.1task.cn.log;
    error_log  /www/wwwlogs/mcp.1task.cn.error.log;

    location / {
        # LLM 客户端会轮询（get_task），额度给足；突发 100。
        limit_req zone=mcp_api burst=100 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/mcp-proxy.inc;
    }
}
