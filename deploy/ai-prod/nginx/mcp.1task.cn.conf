# jieapi MCP 网关 :80 入口 —— 除 ACME 验证外一律跳 HTTPS
server {
    listen 80;
    server_name mcp.1task.cn;

    access_log /www/wwwlogs/mcp.1task.cn.log;
    error_log  /www/wwwlogs/mcp.1task.cn.error.log;

    # 🔴 ACME 通道必须排在 location / 之前，否则被 catch-all 吃掉
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
